name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # for crates.io trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"' \
            | while read -r name version; do
                if [ "$version" != "$tag" ]; then
                  echo "::error::$name is at version $version, but the tag is $GITHUB_REF_NAME"
                  exit 1
                fi
              done
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # publishes the macros crate first, since sql_interpolate depends on it
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
